<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PayFlow - Database App</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #111827;
            --primary: #8b5cf6;
            --primary-2: #a78bfa;
            --secondary: #14b8a6;
            --text: #e5e7eb;
            --muted: #94a3b8;
            --line: rgba(148, 163, 184, 0.2);
            --success: #22c55e;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #020817 0%, #111827 100%);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .box {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
        }

        .hidden { display: none !important; }

        /* LOGIN & REGISTER */
        .auth-form h1 {
            margin: 0 0 8px;
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .auth-form .subtitle {
            color: var(--muted);
            margin-bottom: 32px;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: 600;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="text"]:focus {
            border-color: rgba(167, 139, 250, 0.8);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
        }

        .btn {
            width: 100%;
            border: 0;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 12px 24px rgba(139, 92, 246, 0.3);
        }

        .btn-primary:hover {
            filter: brightness(1.08);
            box-shadow: 0 15px 35px rgba(139, 92, 246, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            border: 1px solid var(--line);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
            width: auto;
            padding: 8px 16px;
            margin-top: 0;
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .toggle-text {
            text-align: center;
            margin-top: 20px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .toggle-text a {
            color: var(--primary);
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.3s ease;
        }

        .toggle-text a:hover {
            color: var(--primary-2);
        }

        .message {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: var(--success);
        }

        .message.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--danger);
        }

        /* DASHBOARD */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--line);
        }

        .dashboard-header h1 {
            margin: 0;
            font-size: 2rem;
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-2), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .user-details .name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .user-details .email {
            font-size: 0.85rem;
            color: var(--muted);
        }

        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--line);
        }

        .tab {
            padding: 14px 20px;
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .tab:hover {
            color: var(--text);
        }

        .tab.active {
            color: var(--text);
            border-bottom-color: var(--primary);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: rgba(167, 139, 250, 0.3);
            background: rgba(139, 92, 246, 0.05);
        }

        .stat-card .label {
            color: var(--muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.05em;
        }

        .stat-card .value {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text);
        }

        .transactions-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        .transactions-table thead {
            border-bottom: 1px solid var(--line);
        }

        .transactions-table th {
            text-align: left;
            padding: 12px;
            color: var(--muted);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .transactions-table td {
            padding: 14px 12px;
            border-bottom: 1px solid var(--line);
            font-size: 0.95rem;
        }

        .transactions-table tr:hover {
            background: rgba(139, 92, 246, 0.05);
        }

        .amount {
            font-weight: 600;
            color: var(--success);
        }

        .amount.negative {
            color: var(--danger);
        }

        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status.completed {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
        }

        .status.pending {
            background: rgba(167, 139, 250, 0.15);
            color: var(--primary);
        }

        .no-data {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
            font-size: 1rem;
        }

        .form-group-disabled {
            margin-bottom: 18px;
        }

        input:disabled {
            background: rgba(15, 23, 42, 0.5);
            cursor: not-allowed;
            opacity: 0.7;
        }

        .logout-btn {
            margin-left: 12px;
        }

        @media (max-width: 768px) {
            .box { padding: 24px; }
            
            .dashboard-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }

            .user-section {
                width: 100%;
                justify-content: space-between;
            }

            .grid-2 { grid-template-columns: 1fr; }
            
            .tabs { flex-wrap: wrap; }
            
            .tab { padding: 12px 16px; }

            .transactions-table {
                font-size: 0.85rem;
            }

            .transactions-table th,
            .transactions-table td {
                padding: 10px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- LOGIN PAGE -->
        <div id="loginPage" class="box auth-form">
            <h1>PayFlow</h1>
            <p class="subtitle">Sistema de pagamentos seguro com base de dados</p>

            <div id="authMessage"></div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" placeholder="seu@email.com" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary">Entrar</button>
            </form>

            <div class="toggle-text">
                Sem conta? <a onclick="toggleAuthForms()">Criar uma</a>
            </div>

            <!-- Register Form -->
            <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="registerName">Nome Completo</label>
                    <input type="text" id="registerName" placeholder="Filipe Pereira" required>
                </div>
                <div class="form-group">
                    <label for="registerEmail">Email</label>
                    <input type="email" id="registerEmail" placeholder="seu@email.com" required>
                </div>
                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary">Criar Conta</button>
            </form>

            <div id="toggleAuthText" class="toggle-text">
                Já tem conta? <a onclick="toggleAuthForms()">Entrar</a>
            </div>
        </div>

        <!-- DASHBOARD PAGE -->
        <div id="dashboardPage" class="box hidden">
            <div class="dashboard-header">
                <h1>Dashboard</h1>
                <div class="user-section">
                    <div>
                        <div class="avatar" id="avatarInitial">F</div>
                    </div>
                    <div class="user-details">
                        <div class="name" id="userName">Filipe</div>
                        <div class="email" id="userEmail">filipe@email.com</div>
                    </div>
                    <button class="btn btn-danger logout-btn" onclick="handleLogout()">Logout</button>
                </div>
            </div>

            <div class="tabs">
                <button class="tab active" onclick="switchTab(event, 'overview')">Overview</button>
                <button class="tab" onclick="switchTab(event, 'transactions')">Transações</button>
                <button class="tab" onclick="switchTab(event, 'profile')">Perfil</button>
            </div>

            <!-- Overview Tab -->
            <div id="overviewTab" class="tab-content active">
                <div class="grid-2">
                    <div class="stat-card">
                        <div class="label">Balanço Total</div>
                        <div class="value" id="totalBalance">€0.00</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Número de Transações</div>
                        <div class="value" id="transactionCount">0</div>
                    </div>
                </div>
            </div>

            <!-- Transactions Tab -->
            <div id="transactionsTab" class="tab-content">
                <div id="transactionsContent">
                    <p class="no-data">Nenhuma transação registada</p>
                </div>
            </div>

            <!-- Profile Tab -->
            <div id="profileTab" class="tab-content">
                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" id="profileName" disabled>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="profileEmail" disabled>
                </div>
                <div class="form-group">
                    <label>Membro desde</label>
                    <input type="text" id="memberSince" disabled>
                </div>
                <button class="btn btn-danger" onclick="clearAllData()">Limpar Todos os Dados</button>
            </div>
        </div>
    </div>

    <script>
        // IndexedDB Setup
        let db;
        const dbName = 'PayFlowDB';
        const storeName = 'users';

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(dbName, 1);
                
                request.onerror = () => {
                    console.error('DB Error:', request.error);
                    reject(request.error);
                };
                
                request.onsuccess = () => {
                    db = request.result;
                    console.log('DB Initialized');
                    resolve();
                };
                
                request.onupgradeneeded = (event) => {
                    db = event.target.result;
                    if (!db.objectStoreNames.contains(storeName)) {
                        db.createObjectStore(storeName, { keyPath: 'email' });
                        console.log('Object Store created');
                    }
                };
            });
        }

        async function saveUser(user) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction([storeName], 'readwrite');
                const store = tx.objectStore(storeName);
                const request = store.put(user);
                
                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    console.log('User saved:', user.email);
                    resolve();
                };
            });
        }

        async function getUser(email) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction([storeName], 'readonly');
                const store = tx.objectStore(storeName);
                const request = store.get(email);
                
                request.onerror = () => reject(request.error);
                request.onsuccess = () => resolve(request.result);
            });
        }

        async function deleteAllUsers() {
            return new Promise((resolve, reject) => {
                const tx = db.transaction([storeName], 'readwrite');
                const store = tx.objectStore(storeName);
                const request = store.clear();
                
                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    console.log('All users deleted');
                    resolve();
                };
            });
        }

        // UI Functions
        function toggleAuthForms() {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const toggleText = document.getElementById('toggleAuthText');
            
            loginForm.classList.toggle('hidden');
            registerForm.classList.toggle('hidden');
            
            if (loginForm.classList.contains('hidden')) {
                toggleText.innerHTML = 'Já tem conta? <a onclick="toggleAuthForms()">Entrar</a>';
                document.querySelector('.auth-form .toggle-text').innerHTML = 'Já tem conta? <a onclick="toggleAuthForms()">Entrar</a>';
            } else {
                toggleText.innerHTML = 'Sem conta? <a onclick="toggleAuthForms()">Criar uma</a>';
                document.querySelector('.auth-form .toggle-text').innerHTML = 'Sem conta? <a onclick="toggleAuthForms()">Criar uma</a>';
            }
        }

        function showMessage(message, type) {
            const msgEl = document.getElementById('authMessage');
            msgEl.innerHTML = `<div class="message ${type}">${message}</div>`;
            if (type === 'success') {
                setTimeout(() => msgEl.innerHTML = '', 4000);
            }
        }

        function switchTab(event, tabName) {
            event.preventDefault();
            
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName + 'Tab').classList.add('active');
            
            if (tabName === 'transactions') loadTransactions();
        }

        // Auth Functions
        async function handleRegister(e) {
            e.preventDefault();
            
            const name = document.getElementById('registerName').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value;
            
            if (!name || !email || !password) {
                showMessage('Por favor preencha todos os campos', 'error');
                return;
            }
            
            const existingUser = await getUser(email);
            if (existingUser) {
                showMessage('Email já registado!', 'error');
                return;
            }
            
            if (password.length < 6) {
                showMessage('Password deve ter pelo menos 6 caracteres', 'error');
                return;
            }
            
            const user = {
                email,
                name,
                password: btoa(password),
                balance: 250.50,
                transactions: [
                    { date: new Date().toISOString(), description: 'Depósito inicial', amount: 250.50, status: 'completed' }
                ],
                createdAt: new Date().toISOString()
            };
            
            try {
                await saveUser(user);
                showMessage('Conta criada com sucesso! Faça login agora.', 'success');
                
                document.getElementById('registerForm').reset();
                setTimeout(() => toggleAuthForms(), 2000);
            } catch (error) {
                showMessage('Erro ao criar conta', 'error');
                console.error(error);
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                showMessage('Por favor preencha email e password', 'error');
                return;
            }
            
            try {
                const user = await getUser(email);
                
                if (!user || user.password !== btoa(password)) {
                    showMessage('Email ou password incorretos!', 'error');
                    return;
                }
                
                localStorage.setItem('currentUser', email);
                showUserDashboard(user);
            } catch (error) {
                showMessage('Erro ao fazer login', 'error');
                console.error(error);
            }
        }

        function showUserDashboard(user) {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('dashboardPage').classList.remove('hidden');
            
            const initial = user.name.charAt(0).toUpperCase();
            document.getElementById('avatarInitial').textContent = initial;
            document.getElementById('userName').textContent = user.name;
            document.getElementById('userEmail').textContent = user.email;
            document.getElementById('profileName').value = user.name;
            document.getElementById('profileEmail').value = user.email;
            document.getElementById('memberSince').value = new Date(user.createdAt).toLocaleDateString('pt-PT');
            
            updateDashboard(user);
        }

        function updateDashboard(user) {
            document.getElementById('totalBalance').textContent = '€' + (user.balance || 0).toFixed(2);
            document.getElementById('transactionCount').textContent = (user.transactions || []).length;
        }

        function loadTransactions() {
            const currentUserEmail = localStorage.getItem('currentUser');
            getUser(currentUserEmail).then(user => {
                const transactions = user.transactions || [];
                if (transactions.length === 0) {
                    document.getElementById('transactionsContent').innerHTML = '<p class="no-data">Nenhuma transação registada</p>';
                    return;
                }
                
                let html = '<table class="transactions-table"><thead><tr><th>Data</th><th>Descrição</th><th>Montante</th><th>Estado</th></tr></thead><tbody>';
                transactions.forEach(t => {
                    const amountClass = t.amount < 0 ? 'negative' : '';
                    const date = new Date(t.date).toLocaleDateString('pt-PT');
                    const status = t.status === 'completed' ? 'Concluída' : 'Pendente';
                    html += `<tr>
                        <td>${date}</td>
                        <td>${t.description}</td>
                        <td class="amount ${amountClass}">€${Math.abs(t.amount).toFixed(2)}</td>
                        <td><span class="status ${t.status}">${status}</span></td>
                    </tr>`;
                });
                html += '</tbody></table>';
                document.getElementById('transactionsContent').innerHTML = html;
            });
        }

        function handleLogout() {
            localStorage.removeItem('currentUser');
            document.getElementById('dashboardPage').classList.add('hidden');
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('loginForm').reset();
            document.getElementById('authMessage').innerHTML = '';
        }

        async function clearAllData() {
            if (confirm('Tem a certeza? Isto vai apagar TODOS os dados de utilizadores.')) {
                try {
                    await deleteAllUsers();
                    handleLogout();
                    showMessage('Todos os dados foram apagados!', 'success');
                } catch (error) {
                    showMessage('Erro ao apagar dados', 'error');
                    console.error(error);
                }
            }
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await initDB();
                
                const currentUser = localStorage.getItem('currentUser');
                if (currentUser) {
                    const user = await getUser(currentUser);
                    if (user) {
                        showUserDashboard(user);
                    } else {
                        localStorage.removeItem('currentUser');
                    }
                }
            } catch (error) {
                console.error('Initialization error:', error);
                showMessage('Erro ao inicializar aplicação', 'error');
            }
        });
    </script>
</body>
</html>
